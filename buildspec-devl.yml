version: 0.2

phases:
  pre_build:
    commands:
      - echo Build started on `date`
      - echo Copying development environment configuration...
      - cp .env.devl .env.local
      - echo Installing dependencies...
      - npm install
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Next.js application for development...
      - npm run build
  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  base-directory: 'out'
  name: fvc-admin-devl-build-$(date +%Y-%m-%d)

cache:
  paths:
    - 'node_modules/**/*'
    - '.next/cache/**/*'